services:
  db:
    image: postgis/postgis:16-3.4
    container_name: weplay_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weplay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weplaysecret}
      POSTGRES_DB: ${POSTGRES_DB:-weplay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weplay} -d ${POSTGRES_DB:-weplay}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weplay_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-weplay}:${POSTGRES_PASSWORD:-weplaysecret}@db:5432/${POSTGRES_DB:-weplay}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-weplay}:${POSTGRES_PASSWORD:-weplaysecret}@db:5432/${POSTGRES_DB:-weplay}
      SECRET_KEY: ${SECRET_KEY:-weplay_super_secret_jwt_key_change_in_production_32bytes}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weplay_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
